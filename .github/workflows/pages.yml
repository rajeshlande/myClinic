name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer commits cancel queued (not running) builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm 12.2.1
        # packageManager pins the exact npm used to build the published bundle.
        run: npm install -g npm@12.2.1 --no-audit --no-fund

      - name: Toolchain
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Contributing standards (CONTRIBUTING.md)
        # ci.yml runs this on pull requests and on branches; main is covered *here*,
        # so without this step a direct push to main was never checked at all.
        run: npm run check:contributing

      - name: Set up Deno
        # Deno, not tsc: the function is deployed from source, and `deno check`
        # is the only compiler that knows Deno.serve, Deno.env and the esm.sh
        # import. It caught a BufferSource typing bug that Deploy had happily
        # shipped because Deploy does not type-check.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno's module cache
        # The function imports exactly one module, from a third-party CDN. Cache
        # it, so a rerun does not have to reach esm.sh at all.
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/sync-clinic-license/index.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Type-check the licence Edge Function
        # esm.sh is not part of this repository: a 5xx or a timeout from it is an
        # outage, not a bug here, so the *network* is retried. A bare or unpinned
        # import specifier is a bug here, and tests/function-imports.test.mjs
        # catches that without any network at all.
        run: |
          FN=supabase/functions/sync-clinic-license/index.ts
          for attempt in 1 2 3; do
            echo "::group::deno check (attempt $attempt of 3)"
            if deno check "$FN"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::deno check failed on attempt $attempt of 3 — its imports come from esm.sh, a third-party CDN"
            sleep $(( attempt * 15 ))
          done
          echo "::error::deno check could not type-check $FN after 3 attempts."
          echo "::error::Check the import specifiers before blaming the CDN — each must be a full module URL, pinned:"
          echo "::error::    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.119.0';"
          echo "::error::A bare host such as 'https://esm.sh' is a web page, not a module, and can never resolve."
          exit 1

      - name: Build
        # Relative asset paths mean this works at /, /<repo>/ and custom domains
        # without changes. Set the VITE_BASE repo variable only to force absolute URLs.
        env:
          VITE_BASE: ${{ vars.VITE_BASE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Keyless Central Auto-Sync. Both empty = license locally, as before.
          VITE_CENTRAL_SUPABASE_URL: ${{ vars.VITE_CENTRAL_SUPABASE_URL }}
          VITE_CENTRAL_SUPABASE_ANON_KEY: ${{ vars.VITE_CENTRAL_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Check GitHub Pages readiness
        run: npm run check:pages

      - name: Report Supabase build configuration
        # Two jobs: (1) make it obvious whether the repo secrets reached the build,
        # (2) fail only on a real misconfiguration. Only the *value* of
        # VITE_SUPABASE_URL can bake a project URL into the bundle, so that value is
        # what gets checked — never help text that merely mentions a placeholder.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE }}
          VITE_CENTRAL_SUPABASE_URL: ${{ vars.VITE_CENTRAL_SUPABASE_URL }}
          VITE_CENTRAL_SUPABASE_ANON_KEY: ${{ vars.VITE_CENTRAL_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          echo "node $(node -v) · npm $(npm -v)"
          echo "VITE_BASE='${VITE_BASE:-}'  (empty = relative assets, correct for /<repo>/)"

          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning title=Demo mode::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are not set as repository secrets, so this deploy runs in demo mode. Add them under Settings -> Secrets and variables -> Actions, then re-run this workflow."
          else
            echo "::notice title=Supabase configured::Both Supabase secrets reached the build — this deploy will run in live mode."
          fi

          status=0

          # A placeholder only matters if it came from the environment variable itself.
          case "${VITE_SUPABASE_URL:-}" in
            *abc.supabase.co*|*YOUR-PROJECT*|*your-project*)
              echo "::error title=Placeholder Supabase URL::VITE_SUPABASE_URL still contains a placeholder value ('${VITE_SUPABASE_URL}'). Set the real https://<ref>.supabase.co URL as a repository secret."
              status=1
              ;;
          esac

          # A secret key must never be inlined into a browser bundle.
          if [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] && grep -qiE 'sb_secret|service_role' <<< "${VITE_SUPABASE_ANON_KEY}"; then
            echo "::error title=Secret key in the bundle::VITE_SUPABASE_ANON_KEY looks like a service-role/secret key. Use the publishable (sb_publishable_...) or anon key instead."
            status=1
          fi

          # ------------------------------------------------ Central Auto-Sync
          # Keyless by design: a URL and a *publishable* key, nothing else. The
          # one mistake that cannot be undone is a privileged key in a variable
          # that is compiled into a bundle and served to every visitor, so that
          # is a hard failure — and the app refuses such a build on its own too.
          if [ -n "${VITE_CENTRAL_SUPABASE_URL:-}" ] || [ -n "${VITE_CENTRAL_SUPABASE_ANON_KEY:-}" ]; then
            if [ -z "${VITE_CENTRAL_SUPABASE_URL:-}" ] || [ -z "${VITE_CENTRAL_SUPABASE_ANON_KEY:-}" ]; then
              echo "::warning title=Central Auto-Sync half configured::One of VITE_CENTRAL_SUPABASE_URL / VITE_CENTRAL_SUPABASE_ANON_KEY is set and the other is not, so the feature stays off and this deploy licenses itself locally. Set both (Variables tab) and re-run."
            elif grep -qiE 'sb_secret|service_role' <<< "${VITE_CENTRAL_SUPABASE_ANON_KEY}"; then
              echo "::error title=Privileged key in the bundle::VITE_CENTRAL_SUPABASE_ANON_KEY matches sb_secret|service_role. That key can read and write the whole central project, and everything here is served to every visitor. Replace it with the publishable key and rotate the secret."
              status=1
            elif ! grep -qiE '^(https://|http://localhost)' <<< "${VITE_CENTRAL_SUPABASE_URL}"; then
              echo "::error title=Central URL is not https::VITE_CENTRAL_SUPABASE_URL must be the https:// project URL (http://localhost only for a local build)."
              status=1
            else
              # The device id and the RPC name are obfuscated into a string array,
              # so do not look for them: look for the central host, which has to
              # reach the bundle for the feature to work at all.
              centralhost=$(printf '%s' "${VITE_CENTRAL_SUPABASE_URL}" | sed -E 's#^(https?://[^/]+).*#\1#')
              if grep -rqF "$centralhost" dist/assets/*.js; then
                echo "::notice title=Central Auto-Sync configured::The central project URL reached the bundle — this deploy takes its plan, seat limits and expiry from the central subscription service, with no licence key, no key pair and no Edge Function."
              else
                echo "::warning title=Central Auto-Sync URL not in the bundle::VITE_CENTRAL_SUPABASE_URL was set but its host does not appear in dist/assets. Check that this step passes it into 'npm run build' and that no .env file overrides it."
              fi
            fi
          else
            echo "Central Auto-Sync: not configured (VITE_CENTRAL_SUPABASE_URL / ANON_KEY empty) — this deploy licenses itself locally, as before."
          fi

          # Sanity: the bundle exists and boots.
          if ! ls dist/assets/*.js >/dev/null 2>&1; then
            echo "::error title=Empty bundle::dist/assets contains no JavaScript."
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Build configuration check failed — see the errors above."
            exit 1
          fi
          echo "Build configuration OK."

      - name: Add a 404 fallback
        run: |
          # .nojekyll already ships from public/ so Jekyll leaves hashed assets alone.
          # Hash routing means every route resolves to index.html; 404.html is a
          # safety net for anyone who opens a deep link without the hash.
          cp dist/index.html dist/404.html
          ls -1 dist | sed 's/^/  /'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
