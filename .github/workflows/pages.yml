name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer commits cancel queued (not running) builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm 12.2.1
        # packageManager pins the exact npm used to build the published bundle.
        run: npm install -g npm@12.2.1 --no-audit --no-fund

      - name: Toolchain
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Contributing standards (CONTRIBUTING.md)
        # ci.yml runs this on pull requests and on branches; main is covered *here*,
        # so without this step a direct push to main was never checked at all.
        run: npm run check:contributing

      - name: Type-check the licence Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/sync-clinic-license/index.ts

      - name: Build
        # Relative asset paths mean this works at /, /<repo>/ and custom domains
        # without changes. Set the VITE_BASE repo variable only to force absolute URLs.
        env:
          VITE_BASE: ${{ vars.VITE_BASE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional. Without it the Subscription screen cannot offer a licence
          # check at all — the app you deploy is told at *build* time whether an
          # authority exists, so a missing key cannot be fixed after the fact.
          VITE_LICENSE_PUBLIC_KEY: ${{ vars.VITE_LICENSE_PUBLIC_KEY }}
          VITE_LICENSE_ISSUER: ${{ vars.VITE_LICENSE_ISSUER }}
        run: npm run build

      - name: Check GitHub Pages readiness
        run: npm run check:pages

      - name: Report Supabase build configuration
        # Two jobs: (1) make it obvious whether the repo secrets reached the build,
        # (2) fail only on a real misconfiguration. Only the *value* of
        # VITE_SUPABASE_URL can bake a project URL into the bundle, so that value is
        # what gets checked — never help text that merely mentions a placeholder.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE }}
          VITE_LICENSE_PUBLIC_KEY: ${{ vars.VITE_LICENSE_PUBLIC_KEY }}
          # The same name with a C, because "licence" is the spelling used in the
          # prose and "license" is the one in the code. A variable that exists
          # under the wrong spelling is indistinguishable from no variable at all
          # unless something looks for it.
          VITE_LICENCE_PUBLIC_KEY: ${{ vars.VITE_LICENCE_PUBLIC_KEY }}
        run: |
          set -uo pipefail

          echo "node $(node -v) · npm $(npm -v)"
          echo "VITE_BASE='${VITE_BASE:-}'  (empty = relative assets, correct for /<repo>/)"

          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning title=Demo mode::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are not set as repository secrets, so this deploy runs in demo mode. Add them under Settings -> Secrets and variables -> Actions, then re-run this workflow."
          else
            echo "::notice title=Supabase configured::Both Supabase secrets reached the build — this deploy will run in live mode."
          fi

          status=0

          # A placeholder only matters if it came from the environment variable itself.
          case "${VITE_SUPABASE_URL:-}" in
            *abc.supabase.co*|*YOUR-PROJECT*|*your-project*)
              echo "::error title=Placeholder Supabase URL::VITE_SUPABASE_URL still contains a placeholder value ('${VITE_SUPABASE_URL}'). Set the real https://<ref>.supabase.co URL as a repository secret."
              status=1
              ;;
          esac

          # A secret key must never be inlined into a browser bundle.
          if [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] && grep -qiE 'sb_secret|service_role' <<< "${VITE_SUPABASE_ANON_KEY}"; then
            echo "::error title=Secret key in the bundle::VITE_SUPABASE_ANON_KEY looks like a service-role/secret key. Use the publishable (sb_publishable_...) or anon key instead."
            status=1
          fi

          # Licence authority: say plainly whether this deploy can check one, and
          # refuse the one mistake that cannot be undone — a private key in a
          # variable that is compiled into a public bundle.
          # What the build could see, before any judgement: presence, size and shape.
          # The key is public; the value is still never printed.
          if [ -n "${VITE_LICENSE_PUBLIC_KEY:-}" ]; then
            echo "VITE_LICENSE_PUBLIC_KEY is present: ${#VITE_LICENSE_PUBLIC_KEY} bytes, starts '$(printf '%s' "${VITE_LICENSE_PUBLIC_KEY}" | head -c 27)', PEM header: $(grep -c 'BEGIN PUBLIC KEY' <<< "${VITE_LICENSE_PUBLIC_KEY}")"
          else
            echo "VITE_LICENSE_PUBLIC_KEY is EMPTY as far as this build job can see."
          fi

          if [ -z "${VITE_LICENSE_PUBLIC_KEY:-}" ] && [ -n "${VITE_LICENCE_PUBLIC_KEY:-}" ]; then
            echo "::error title=Variable name is misspelled::VITE_LICENCE_PUBLIC_KEY is set (with a C) but the app and the workflow read VITE_LICENSE_PUBLIC_KEY (with an S). Rename the variable; nothing else needs to change."
            status=1
          fi

          if [ -z "${VITE_LICENSE_PUBLIC_KEY:-}" ]; then
            echo "::notice title=No licence authority::VITE_LICENSE_PUBLIC_KEY reached this build empty, so this deploy licenses itself locally and the Subscription screen says 'Not in this build'. Check three things: (1) it is on the Variables tab, not the Secrets tab -- vars.* reads Variables only; (2) it is repository-wide, not scoped to the github-pages environment -- this build job declares no environment, so an environment variable is invisible to it; (3) adding or changing a variable does NOT start a run, so re-run this workflow afterwards. Then look for 'Licence authority configured' in this step's log."
          elif grep -q 'PRIVATE KEY' <<< "${VITE_LICENSE_PUBLIC_KEY}"; then
            echo "::error title=Private key in a public variable::VITE_LICENSE_PUBLIC_KEY contains a PRIVATE KEY block. Everything here is compiled into the bundle and served to every visitor. Remove the variable and roll the authority's key pair before doing anything else."
            status=1
          else
            # Look for the key *material*, not the words "BEGIN PUBLIC KEY" —
            # those words also appear in the code that tests for them, so a naive
            # grep passes even when no key reached the bundle.
            keymaterial=$(grep -oE 'MII[A-Za-z0-9+/]{40,}' <<< "${VITE_LICENSE_PUBLIC_KEY}" | head -1)
            if [ -z "$keymaterial" ]; then
              echo "::error title=Public key not recognised::VITE_LICENSE_PUBLIC_KEY contains no base64 key material, so the app will treat this build as having no authority. Paste the whole PEM, newlines as \\n."
              status=1
            elif ! grep -rqF "$keymaterial" dist/assets/*.js; then
              echo "::error title=Public key did not reach the bundle::VITE_LICENSE_PUBLIC_KEY was set but the built bundle does not contain its key material, so the Subscription screen still cannot check a licence. Check that this step passes it into 'npm run build' and that no .env file overrides it."
              status=1
            else
              echo "::notice title=Licence authority configured::The public key reached the bundle — the Subscription screen can connect this clinic to the authority."
            fi
          fi

          # Sanity: the bundle exists and boots.
          if ! ls dist/assets/*.js >/dev/null 2>&1; then
            echo "::error title=Empty bundle::dist/assets contains no JavaScript."
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Build configuration check failed — see the errors above."
            exit 1
          fi
          echo "Build configuration OK."

      - name: Add a 404 fallback
        run: |
          # .nojekyll already ships from public/ so Jekyll leaves hashed assets alone.
          # Hash routing means every route resolves to index.html; 404.html is a
          # safety net for anyone who opens a deep link without the hash.
          cp dist/index.html dist/404.html
          ls -1 dist | sed 's/^/  /'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
