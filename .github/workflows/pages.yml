name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer commits cancel queued (not running) builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm 12.2.1
        # packageManager pins the exact npm used to build the published bundle.
        run: npm install -g npm@12.2.1 --no-audit --no-fund

      - name: Toolchain
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build
        # Relative asset paths mean this works at /, /<repo>/ and custom domains
        # without changes. Set the VITE_BASE repo variable only to force absolute URLs.
        env:
          VITE_BASE: ${{ vars.VITE_BASE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Check GitHub Pages readiness
        run: npm run check:pages

      - name: Report Supabase build configuration
        # Two jobs: (1) make it obvious whether the repo secrets reached the build,
        # (2) fail only on a real misconfiguration. Only the *value* of
        # VITE_SUPABASE_URL can bake a project URL into the bundle, so that value is
        # what gets checked — never help text that merely mentions a placeholder.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: |
          set -uo pipefail

          echo "node $(node -v) · npm $(npm -v)"
          echo "VITE_BASE='${VITE_BASE:-}'  (empty = relative assets, correct for /<repo>/)"

          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning title=Demo mode::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are not set as repository secrets, so this deploy runs in demo mode. Add them under Settings -> Secrets and variables -> Actions, then re-run this workflow."
          else
            echo "::notice title=Supabase configured::Both Supabase secrets reached the build — this deploy will run in live mode."
          fi

          status=0

          # A placeholder only matters if it came from the environment variable itself.
          case "${VITE_SUPABASE_URL:-}" in
            *abc.supabase.co*|*YOUR-PROJECT*|*your-project*)
              echo "::error title=Placeholder Supabase URL::VITE_SUPABASE_URL still contains a placeholder value ('${VITE_SUPABASE_URL}'). Set the real https://<ref>.supabase.co URL as a repository secret."
              status=1
              ;;
          esac

          # A secret key must never be inlined into a browser bundle.
          if [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] && grep -qiE 'sb_secret|service_role' <<< "${VITE_SUPABASE_ANON_KEY}"; then
            echo "::error title=Secret key in the bundle::VITE_SUPABASE_ANON_KEY looks like a service-role/secret key. Use the publishable (sb_publishable_...) or anon key instead."
            status=1
          fi

          # Sanity: the bundle exists and boots.
          if ! ls dist/assets/*.js >/dev/null 2>&1; then
            echo "::error title=Empty bundle::dist/assets contains no JavaScript."
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Build configuration check failed — see the errors above."
            exit 1
          fi
          echo "Build configuration OK."

      - name: Add a 404 fallback
        run: |
          # .nojekyll already ships from public/ so Jekyll leaves hashed assets alone.
          # Hash routing means every route resolves to index.html; 404.html is a
          # safety net for anyone who opens a deep link without the hash.
          cp dist/index.html dist/404.html
          ls -1 dist | sed 's/^/  /'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
