name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by pages.yml

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} · tests + build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the declared engine floor (react-router 8 needs >=22.22); 26 is current LTS.
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: |
          node -v
          npm -v
          npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build (default base)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: GitHub Pages readiness
        run: npm run check:pages

      - name: Build from a repository sub-path
        run: VITE_BASE=/myclinic/ npm run build && VITE_BASE=/myclinic/ npm run check:pages

      - name: Security checklist
        run: npm run test:security

      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
