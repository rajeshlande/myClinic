name: Security report
description: Report a vulnerability (please read before submitting)
labels: [security]
body:
  - type: markdown
    attributes:
      value: |
        **Do not open a public issue for a vulnerability that exposes patient data.**

        Email the maintainers instead, or use GitHub's private
        [Report a vulnerability](https://docs.github.com/code-security/security-advisories/guidance-on-reporting-and-writing-information-about-vulnerabilities/privately-reporting-a-security-vulnerability)
        flow on the Security tab. Include the affected version, a minimal reproduction against a
        **scratch** project, and the impact you believe it has.

        If you are unsure whether something is sensitive, report it privately. We would rather
        triage a false alarm than read about a breach.
  - type: checkboxes
    attributes:
      label: Confirmation
      options:
        - label: This report contains no real patient data or credentials.
          required: true
