<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>myClinic — OPD Clinic Management Software</title>
    <meta name="description" content="myClinic is OPD management software for clinics: appointments, patient records, consultations, billing and follow-ups in one platform. Works on desktop, tablet and phone." />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07100f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="myClinic" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="myClinic — Everything you need for smarter OPD clinic management" />
    <meta property="og:description" content="Appointments, patient records, consultations, billing and follow-ups in one platform. Built for single and multi-doctor OPDs." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <style>
      /* first-paint background so the shell never flashes white in dark mode */
      html { background: #f4f7f6; }
      @media (prefers-color-scheme: dark) { html { background: #060e0d; } }
      #boot { min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #61736e; font-size: 14px; }
      #boot .mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(145deg, #12a094, #08403c); margin: 0 auto 10px; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .55; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div><div class="mark"></div>Opening myClinic…</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
